
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 과목</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #D6D6FF;
      color: #35358D;
    }

    header {
      text-align: center;
      padding: 25px 15px 18px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 38px;
    }

    header p {
      margin: 0;
      color: #55559A;
    }

    /* 과목 선택 버튼 */
    .subjects {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 15px 20px;
    }

    .subject-button {
      border: 0;
      border-radius: 20px;
      padding: 11px 22px;
      background: white;
      color: #35358D;
      font-size: 16px;
      cursor: pointer;
    }

    .subject-button.active {
      background: #6565E8;
      color: white;
      font-weight: bold;
    }

    .subject-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* 왼쪽 영상 목록과 오른쪽 재생 화면 */
    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 30px;
      min-height: 500px;
    }

    .panel {
      background: #F7F7FF;
      border-radius: 18px;
      padding: 20px;
      min-width: 0;
    }

    .panel h2 {
      font-size: 21px;
      margin: 0 0 18px;
      overflow-wrap: anywhere;
    }

    /* 영상 제목 목록 */
    #video-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .video-item {
      width: 100%;
      border: 1px solid #D0D0FF;
      border-radius: 10px;
      background: white;
      padding: 13px;
      text-align: left;
      color: #35358D;
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .video-item:hover,
    .video-item.active {
      background: #E5E5FF;
      border-color: #6565E8;
    }

    .video-item.active {
      font-weight: bold;
    }

    .message {
      color: #73739A;
      line-height: 1.7;
      font-size: 14px;
    }

    /* 영상 재생 화면 */
    .video-player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #E9E9F8;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #111;
    }

    .placeholder {
      text-align: center;
      padding: 20px;
      color: #6565A0;
    }

    .placeholder .play-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    #video-title {
      margin: 18px 0 10px;
      font-size: 23px;
      overflow-wrap: anywhere;
    }

    #video-description {
      color: #66668E;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      header h1 {
        font-size: 30px;
      }

      .layout {
        grid-template-columns: 1fr;
        padding: 0 12px 20px;
        gap: 14px;
      }

      .panel {
        padding: 16px;
      }

      .subjects {
        gap: 7px;
      }

      .subject-button {
        padding: 10px 15px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>오늘의 과목</h1>
    <p>좋아하는 과목의 영상을 시청해 보세요 ✨</p>
  </header>

  <!-- 과목 선택 -->
  <nav class="subjects" aria-label="과목 선택">
    <button class="subject-button active" data-subject="국어">국어</button>
    <button class="subject-button" data-subject="영어">영어</button>
    <button class="subject-button" data-subject="수학">수학</button>
    <button class="subject-button" data-subject="과학">과학</button>
    <button class="subject-button" data-subject="사회">사회</button>
  </nav>

  <main class="layout">
    <!-- 왼쪽: 영상 목록 -->
    <section class="panel">
      <h2 id="list-heading">📚 국어 영상 목록</h2>
      <div id="video-list">
        <p class="message">영상을 불러오는 중...</p>
      </div>
    </section>

    <!-- 오른쪽: 영상 재생 -->
    <section class="panel">
      <h2>🎬 영상 시청</h2>

      <div class="video-player" id="player-area">
        <div class="placeholder">
          <div class="play-icon">▶</div>
          <p>왼쪽 목록에서 영상을 선택해 줘.</p>
        </div>
      </div>

      <h3 id="video-title">영상을 선택해 주세요</h3>
      <p id="video-description">선택한 영상의 설명이 여기에 표시돼.</p>
    </section>
  </main>

  <script type="module">
    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // 1. Supabase 프로젝트 정보 입력
    const SUPABASE_URL = "https://lmnsvmrmjvchwkoaftyq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_lvuCUrAbKitYPxH2tA2XnA_-3rJ_QLN";
    const BUCKET_NAME = "subject-videos";

    // 2. 화면에 표시할 과목과 실제 Storage 폴더 이름 연결
    const subjectFolders = {
      "국어": "Korean",
      "영어": "English",
      "수학": "Math",
      "과학": "Science",
      "사회": "Social"
    };

    // Supabase 연결
    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    // HTML 요소 가져오기
    const videoList = document.getElementById("video-list");
    const listHeading = document.getElementById("list-heading");
    const playerArea = document.getElementById("player-area");
    const videoTitle = document.getElementById("video-title");
    const videoDescription = document.getElementById("video-description");
    const subjectButtons = document.querySelectorAll(".subject-button");

    // 현재 선택된 과목과 영상 정보
    let currentSubject = "국어";
    let currentVideos = [];
    let loadNumber = 0;

    // 파일명에서 확장자 제거
    function getVideoTitle(fileName) {
      return fileName.replace(/\.[^/.]+$/, "");
    }

    // 동영상 파일인지 확인
    function isVideoFile(fileName) {
      return /\.(mp4|webm|ogv|mov|m4v)$/i.test(fileName);
    }

    // 영상 목록에 안내 메시지 표시
    function showMessage(message) {
      videoList.replaceChildren();

      const paragraph = document.createElement("p");
      paragraph.className = "message";
      paragraph.textContent = message;

      videoList.appendChild(paragraph);
    }

    // 재생 화면 초기화
    function resetPlayer() {
      playerArea.replaceChildren();

      const placeholder = document.createElement("div");
      placeholder.className = "placeholder";

      const icon = document.createElement("div");
      icon.className = "play-icon";
      icon.textContent = "▶";

      const message = document.createElement("p");
      message.textContent = "왼쪽 목록에서 영상을 선택해 줘.";

      placeholder.append(icon, message);
      playerArea.appendChild(placeholder);

      videoTitle.textContent = "영상을 선택해 주세요";
      videoDescription.textContent = "";
    }

    // 선택한 과목의 영상 목록 불러오기
    async function loadVideos(subject) {
      // 이전 요청의 결과가 늦게 도착해 화면을 덮지 않도록 확인
      const thisLoadNumber = ++loadNumber;

      currentSubject = subject;
      currentVideos = [];

      // 선택한 과목 버튼 강조
      subjectButtons.forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.subject === subject
        );
      });

      listHeading.textContent = `📚 ${subject} 영상 목록`;

      resetPlayer();
      showMessage("영상을 불러오는 중...");

      // 과목 폴더 이름 확인
      const folderName = subjectFolders[subject];

      console.log("선택한 과목:", subject);
      console.log("폴더 연결 결과:", folderName);

      if (!folderName) {
        showMessage("해당 과목의 폴더를 찾을 수 없어.");
        return;
      }

      try {
        // 해당 과목 폴더의 파일 목록 가져오기
        const { data, error } = await supabase.storage
          .from(BUCKET_NAME)
          .list(folderName, {
            limit: 100,
            sortBy: {
              column: "name",
              order: "asc"
            }
          });
        
console.log("선택한 과목:", subject);
console.log("조회한 폴더:", folderName);
console.log("Supabase 파일 목록:", data);
console.log("Supabase 오류:", error);

        // 다른 과목으로 바뀌었다면 이전 결과 무시
        if (thisLoadNumber !== loadNumber) {
          return;
        }

        if (error) {
          throw error;
        }

        // 동영상 파일만 남기기
        currentVideos = (data || []).filter(file => {
          return file.name &&
            isVideoFile(file.name);
        });

        // 영상이 없는 경우
        if (currentVideos.length === 0) {
          showMessage(
            `${subject} 폴더에서 동영상을 찾지 못했어.\n` +
            "Supabase Storage의 폴더 이름과 파일 형식을 확인해 줘."
          );
          return;
        }

        // 영상 목록 버튼 만들기
        videoList.replaceChildren();

        currentVideos.forEach(file => {
          const button = document.createElement("button");
          button.className = "video-item";
          button.textContent = getVideoTitle(file.name);

          button.addEventListener("click", () => {
            playVideo(file, subject);
          });

          videoList.appendChild(button);
        });

      } catch (error) {
        // 오래된 요청의 오류는 현재 화면에 표시하지 않음
        if (thisLoadNumber !== loadNumber) {
          return;
        }

        console.error("영상 목록 불러오기 오류:", error);

        showMessage(
          "영상 목록을 불러오지 못했어.\n" +
          "Supabase URL, 키, 버킷 이름, 폴더 이름 및 Storage 정책을 확인해 줘."
        );
      }
    }

    // 선택한 영상 재생하기
    function playVideo(file, subject) {
      // 다른 과목의 영상이 재생되는 것을 방지
      if (subject !== currentSubject) {
        return;
      }

      // 파일의 실제 영문 폴더 경로 사용
      const folderName = subjectFolders[subject];
      const filePath = `${folderName}/${file.name}`;

      const { data } = supabase.storage
        .from(BUCKET_NAME)
        .getPublicUrl(filePath);

      const video = document.createElement("video");
      video.controls = true;
      video.playsInline = true;
      video.preload = "metadata";
      video.src = data.publicUrl;

      // 재생 오류 안내
      video.addEventListener("error", () => {
        videoDescription.textContent =
          "영상을 재생할 수 없어.\n" +
          "파일 주소, 공개 설정, 파일 형식을 확인해 줘.";
      });

      playerArea.replaceChildren(video);

      videoTitle.textContent = getVideoTitle(file.name);
      videoDescription.textContent = "";

      // 선택한 영상 버튼 강조
      document.querySelectorAll(".video-item").forEach(button => {
        button.classList.toggle(
          "active",
          button.textContent === getVideoTitle(file.name)
        );
      });
    }

    // 과목 버튼 클릭 이벤트 연결
    subjectButtons.forEach(button => {
      button.addEventListener("click", () => {
        loadVideos(button.dataset.subject);
      });
    });

    // 사이트를 처음 열면 국어 영상 목록 표시
    loadVideos("국어");
  </script>
</body>
</html>
