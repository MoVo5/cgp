<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 과목</title>

<style>
:root {
  --site-primary: #7774D8;
  --site-secondary: #F0DFFF;
  --site-background: #DCD9FF;
  --site-on-primary: #FFFFFF;
  --site-on-secondary: #39346E;
  --site-on-background: #302D69;
  --site-font-body: "Pretendard", "Malgun Gothic", Arial, sans-serif;
  --site-font-heading: "Pretendard", "Malgun Gothic", Arial, sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: var(--site-font-body);
  background: var(--site-background);
  color: var(--site-on-background);
}

#app {
  min-height: 100vh;
  width: 100%;
  background-color: var(--site-background);
  border-radius: 0;
  padding: clamp(18px, 3vw, 42px);
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 0 auto clamp(18px, 3vh, 34px);
  width: min(100%, 1400px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark {
  width: 48px;
  height: 48px;
  border-radius: 17px;
  background: var(--site-primary);
  color: var(--site-on-primary);
  display: grid;
  place-items: center;
  font-size: 25px;
  font-weight: 900;
  box-shadow: 0 8px 20px #514ca833;
}

h1 {
  margin: 0;
  font-family: var(--site-font-heading);
  font-size: clamp(25px, calc(2.4vw * var(--site-heading-scale)), 38px);
  letter-spacing: -1.5px;
}

.subtitle {
  margin: 5px 0 0;
  color: #66639A;
  font-size: clamp(12px, 1.2vw, 15px);
  font-weight: 600;
}

.header-tag {
  background: #FFFFFFA8;
  border: 1px solid #FFFFFF;
  padding: 10px 16px;
  border-radius: 999px;
  color: #514E91;
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
}

main {
  width: min(100%, 1400px);
  margin: 0 auto;
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(210px, 1fr));
  gap: clamp(12px, 2vw, 24px);
  min-height: 560px;
}

.subject {
  border: 0;
  border-radius: calc(32px * var(--site-radius-scale));
  min-height: 210px;
  padding: clamp(20px, 3vw, 38px);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  color: #34315F;
  box-shadow: 0 14px 34px #514b8520;
  transition: transform .2s ease, box-shadow .2s ease;
  isolation: isolate;
}

.subject:hover {
  transform: translateY(-6px);
  box-shadow: 0 22px 42px #514b8530;
}

.subject:focus-visible {
  outline: 4px solid #35317A;
  outline-offset: 4px;
}

.subject:nth-child(1) {
  grid-column: span 2;
  background: #FFF0B8;
}

.subject:nth-child(2) {
  grid-column: span 2;
  background: #FFD9E7;
}

.subject:nth-child(3) {
  grid-column: span 2;
  background: #D8E4FF;
}

.subject:nth-child(4) {
  grid-column: 2 / span 2;
  background: #DDF3D6;
}

.subject:nth-child(5) {
  grid-column: 4 / span 2;
  background: #E8DFFF;
}

.subject::before,
.subject::after {
  content: "";
  position: absolute;
  z-index: -1;
  border-radius: 50%;
  background: #FFFFFF;
  opacity: .38;
}

.subject::before {
  width: 220px;
  height: 220px;
  right: -52px;
  top: -76px;
}

.subject::after {
  width: 120px;
  height: 120px;
  right: 76px;
  bottom: -74px;
  opacity: .25;
}

.subject-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.subject-icon {
  font-size: clamp(36px, 5vw, 62px);
  line-height: 1;
  filter: drop-shadow(0 7px 8px #4c467322);
}

.subject-number {
  font-size: 13px;
  font-weight: 900;
  opacity: .55;
  letter-spacing: 1px;
}

.subject-name {
  display: block;
  font-size: clamp(31px, 4vw, 54px);
  font-weight: 950;
  letter-spacing: -2px;
  line-height: 1.05;
}

.subject-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 22px;
}

.subject-hint {
  font-size: clamp(12px, 1.2vw, 15px);
  font-weight: 750;
  opacity: .7;
}

.arrow {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #FFFFFFA8;
  display: grid;
  place-items: center;
  font-size: 23px;
  font-weight: 900;
}

footer {
  width: min(100%, 1400px);
  margin: 18px auto 0;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: #69669A;
  font-size: 12px;
  font-weight: 650;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #25234D88;
  display: none;
  place-items: center;
  padding: 20px;
}

.modal-backdrop.show {
  display: grid;
}

.modal {
  width: min(100%, 440px);
  border-radius: 26px;
  padding: 28px;
  background: #FFFFFF;
  color: #353264;
  box-shadow: 0 25px 80px #17143c55;
  text-align: center;
}

.modal-icon {
  font-size: 42px;
}

.modal h2 {
  margin: 12px 0 8px;
  font-size: 25px;
}

.modal p {
  margin: 0;
  color: #77749A;
  line-height: 1.6;
}

.modal button {
  margin-top: 22px;
  border: 0;
  border-radius: 14px;
  background: #7774D8;
  color: white;
  padding: 13px 28px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.social-links {
  display: grid;
  gap: 12px;
  margin-top: 18px;
}

.social-links a {
  display: block;
  padding: 15px 18px;
  border-radius: 14px;
  background: #EEE9FF;
  color: #39346E;
  font-weight: 850;
  text-decoration: none;
}

.social-links a:hover {
  background: #DDD5FF;
}

@media (max-width: 700px) {
  #app {
    padding: 18px;
  }

  header {
    align-items: flex-start;
  }

  .header-tag {
    display: none;
  }

  main {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: none;
    min-height: 0;
  }

  .subject {
    grid-column: span 1 !important;
    min-height: 190px;
    padding: 20px;
  }

  .subject:last-child {
    grid-column: 1 / -1 !important;
    min-height: 160px;
  }

  .subject-name {
    font-size: clamp(30px, 8vw, 42px);
  }

  footer {
    flex-direction: column;
  }
}

@media (max-width: 390px) {
  main {
    gap: 10px;
  }

  .subject {
    min-height: 165px;
    padding: 16px;
    border-radius: 22px;
  }

  .subject-icon {
    font-size: 34px;
  }

  .subject-name {
    font-size: 29px;
  }
}
</style>
</head>

<body>

<div id="app">

  <header>
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <h1>오늘의 과목</h1>
        <p class="subtitle">오늘은 어떤 과목을 공부할까?</p>
      </div>
    </div>

    <div class="header-tag">MY STUDY · MOVO</div>
  </header>

  <main aria-label="과목 선택">

    <button class="subject" data-subject="국어" type="button">
      <span class="subject-top">
        <span class="subject-icon">📖</span>
        <span class="subject-number">SUBJECT 01</span>
      </span>
      <span>
        <span class="subject-name">국어</span>
        <span class="subject-bottom">
          <span class="subject-hint">읽고 생각하는 시간</span>
          <span class="arrow">↗</span>
        </span>
      </span>
    </button>

    <button class="subject" data-subject="영어" type="button">
      <span class="subject-top">
        <span class="subject-icon">🌍</span>
        <span class="subject-number">SUBJECT 02</span>
      </span>
      <span>
        <span class="subject-name">영어</span>
        <span class="subject-bottom">
          <span class="subject-hint">새로운 언어와 만나는 시간</span>
          <span class="arrow">↗</span>
        </span>
      </span>
    </button>

    <button class="subject" data-subject="수학" type="button">
      <span class="subject-top">
        <span class="subject-icon">📐</span>
        <span class="subject-number">SUBJECT 03</span>
      </span>
      <span>
        <span class="subject-name">수학</span>
        <span class="subject-bottom">
          <span class="subject-hint">차근차근 풀어가는 시간</span>
          <span class="arrow">↗</span>
        </span>
      </span>
    </button>

    <button class="subject" data-subject="과학" type="button">
      <span class="subject-top">
        <span class="subject-icon">🔬</span>
        <span class="subject-number">SUBJECT 04</span>
      </span>
      <span>
        <span class="subject-name">과학</span>
        <span class="subject-bottom">
          <span class="subject-hint">세상의 원리를 발견하는 시간</span>
          <span class="arrow">↗</span>
        </span>
      </span>
    </button>

    <button class="subject" data-subject="사회" type="button">
      <span class="subject-top">
        <span class="subject-icon">🏛️</span>
        <span class="subject-number">SUBJECT 05</span>
      </span>
      <span>
        <span class="subject-name">사회</span>
        <span class="subject-bottom">
          <span class="subject-hint">우리 사회를 알아가는 시간</span>
          <span class="arrow">↗</span>
        </span>
      </span>
    </button>

  </main>

  <footer>
    <span>한 번의 클릭으로 공부를 시작해 봐!</span>
    <span>© MOVO · TODAY'S SUBJECT</span>
  </footer>

</div>

<div class="modal-backdrop" id="notice" role="dialog" aria-modal="true" aria-labelledby="noticeTitle">

  <div class="modal">
    <div class="modal-icon">🔗</div>
    <h2 id="noticeTitle">영상 링크를 연결해 주세요</h2>
    <p id="noticeText">
      이 과목의 영상 주소가 아직 입력되지 않았어요.
    </p>
    <button type="button" id="closeNotice">확인</button>
  </div>

</div>

<script>

// 과목별 Google Drive 영상 링크
const videoLinks = {

  "국어": "",

  "영어": "https://drive.google.com/file/d/12xPhuBSJ-xIkuNGQWeK9LpQ3MUvApXzf/view?usp=sharing",

  "수학": "https://drive.google.com/file/d/1XUrqdFnD9V94mWKcX7O95sa8FvEPiDdY/view?usp=sharing",

  "과학": "",

  "사회": {
    "역사": "https://drive.google.com/file/d/1kpgeb1EAGxviiYWCTU4hGNzVTWt0OOAM/view?usp=sharing",

    "일반사회": "https://drive.google.com/file/d/1B8Iv_FKOJuakhrHjHKUjk41FnrwIhsSu/view?usp=sharing"
  }

};

const notice = document.getElementById("notice");
const noticeText = document.getElementById("noticeText");
const closeNotice = document.getElementById("closeNotice");

document.querySelectorAll(".subject").forEach((button) => {

  button.addEventListener("click", () => {

    const subject = button.dataset.subject;
    const link = videoLinks[subject];

    if (subject === "사회") {

      noticeText.innerHTML =
        '<span class="social-links">' +
        '<a href="' + link["역사"] + '" target="_blank" rel="noopener noreferrer">📜 역사 영상 보기</a>' +
        '<a href="' + link["일반사회"] + '" target="_blank" rel="noopener noreferrer">🏛️ 일반사회 영상 보기</a>' +
        '</span>';

      document.getElementById("noticeTitle").textContent = "사회 과목 선택";

      notice.classList.add("show");
      closeNotice.focus();

    } else if (link) {

      window.open(link, "_blank", "noopener,noreferrer");

    } else {

      document.getElementById("noticeTitle").textContent = "영상 준비 중";

      noticeText.textContent =
        `${subject} 과목의 영상은 아직 준비 중이에요. 조금만 기다려 주세요!`;

      notice.classList.add("show");
      closeNotice.focus();

    }

  });

});

function closeDialog() {
  notice.classList.remove("show");
}

closeNotice.addEventListener("click", closeDialog);

notice.addEventListener("click", (event) => {
  if (event.target === notice) closeDialog();
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeDialog();
});

</script>

</body>
</html>
